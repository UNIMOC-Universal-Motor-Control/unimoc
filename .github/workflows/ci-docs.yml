name: Documentation
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  doxygen:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build doxygen graphviz clang
          pip install 'cmake>=4,<5'
      - run: cmake --workflow --preset "Generate Doxygen documentation"
      - uses: actions/upload-artifact@v4
        with:
          name: doxygen-html
          path: build/doxygen
