name: CI

on:
  push:
    branches: [main, develop, "copilot/**"]
  pull_request:
    branches: [main, develop, "copilot/**"]

jobs:
  hosted-test:
    name: Hosted build, test & clang-tidy (Linux x86-64)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y ninja-build clang-tidy

      - name: Install CMake 4.x
        run: pip install "cmake>=4,<5" --quiet

      - name: Configure, build, test and clang-tidy
        run: cmake --workflow --preset "Hosted configure, build and test + clang tidy"

  batterycase-build:
    name: BatteryCase Controller firmware build (ARM Cortex-M4)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y ninja-build gcc-arm-none-eabi python-is-python3

      - name: Install CMake 4.x
        run: pip install "cmake>=4,<5" pyelftools --quiet

      - name: Configure
        run: cmake --preset "BatteryCaseController Debug"

      - name: Build
        run: cmake --build --preset "BatteryCaseController Debug"
