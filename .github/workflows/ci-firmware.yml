name: Firmware
on:
  push:
    branches: [main, develop, "copilot/**"]
  pull_request:
    branches: [main, develop, "copilot/**"]
concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true
jobs:
  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: "BatteryCaseController Debug build"
            name: debug
          - preset: "BatteryCaseController Release build"
            name: release
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build gcc-arm-none-eabi python-is-python3
          pip install 'cmake>=4,<5' pyelftools
      - run: cmake --workflow --preset "${{ matrix.preset }}"
      - name: Firmware size summary
        run: find build -name '*.elf' -exec arm-none-eabi-size {} \;
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.name }}
          path: |
            build/**/*.elf
            build/**/*.hex
            build/**/*.bin
            build/**/*.map
